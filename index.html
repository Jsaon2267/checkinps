  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 20px 12px; color: #1e293b; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    
    .header-title { font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 18px 0; text-align: center; }
    
    .search-box { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; transition: border-color 0.2s; margin-bottom: 20px; }
    .search-box:focus { border-color: #2563eb; }
    
    .section-title { font-size: 15px; font-weight: 700; color: #475569; margin: 16px 0 10px 0; display: flex; align-items: center; gap: 6px; }
    
    .fav-card-box { background: #fffbeb; border: 1.5px solid #fef3c7; border-radius: 12px; padding: 12px 14px; margin-bottom: 24px; }
    .fav-card-box .section-title { margin-top: 0; color: #b45309; }

    .list-group { list-style: none; padding: 0; margin: 0; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; border-radius: 8px; margin-bottom: 4px; transition: background 0.15s; }
    .list-item:hover { background-color: #f8fafc; }
    .fav-card-box .list-item { background: #ffffff; border: 1px solid #fde68a; }
    
    .item-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .star-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 4px; color: #cbd5e1; line-height: 1; transition: transform 0.15s, color 0.15s; }
    .star-btn.active { color: #f59e0b; }
    .star-btn:hover { transform: scale(1.15); }
    .item-text { font-size: 15px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-go { background: #2563eb; color: #ffffff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; margin-left: 10px; transition: background 0.2s; }
    .btn-go:hover { background: #1d4ed8; }
    .empty-tip { text-align: center; color: #94a3b8; font-size: 13px; padding: 12px 0; }
  </style>
</head>

  // 讀取本地釘選紀錄（預設海安站）
  let favorites = [];
  try {
    favorites = JSON.parse(localStorage.getItem("FAV_IDS")) || [1];
  } catch(e) {
    favorites = [1];
  }

  function toggleFav(id) {
    const idx = favorites.indexOf(id);
    if (idx > -1) {
      favorites.splice(idx, 1);
    } else {
      favorites.push(id);
    }
    localStorage.setItem("FAV_IDS", JSON.stringify(favorites));
    render();
  }

  function buildRow(item, isFav) {
    const li = document.createElement("li");
    li.className = "list-item";

    const left = document.createElement("div");
    left.className = "item-info";

    const star = document.createElement("button");
    star.className = "star-btn" + (isFav ? " active" : "");
    star.innerHTML = "★";
    star.onclick = function() { toggleFav(item.id); };

    const text = document.createElement("span");
    text.className = "item-text";
    text.textContent = item.name;

    left.appendChild(star);
    left.appendChild(text);

    const btn = document.createElement("a");
    btn.className = "btn-go";
    btn.href = item.url;
    btn.target = "_blank";
    btn.textContent = "前往點車位";

    li.appendChild(left);
    li.appendChild(btn);
    return li;
  }

  function render() {
    const kw = (document.getElementById("searchInput").value || "").trim().toLowerCase();
    const favUl = document.getElementById("favoriteList");
    const allUl = document.getElementById("allList");

    favUl.innerHTML = "";
    allUl.innerHTML = "";

    // 1. 渲染我的最愛
    const favItems = parkingData.filter(item => favorites.includes(item.id) && item.name.toLowerCase().includes(kw));
    if (favorites.length === 0) {
      favUl.innerHTML = `<li class="empty-tip">尚未釘選任何常用場地，點擊下方 ★ 即可加入</li>`;
    } else if (favItems.length === 0) {
      favUl.innerHTML = `<li class="empty-tip">常用場地中無相符資料</li>`;
    } else {
      favItems.forEach(item => favUl.appendChild(buildRow(item, true)));
    }

    // 2. 渲染全部場地
    const allItems = parkingData.filter(item => item.name.toLowerCase().includes(kw));
    if (allItems.length === 0) {
      allUl.innerHTML = `<li class="empty-tip">查無相符場地</li>`;
    } else {
      allItems.forEach(item => {
        const isFav = favorites.includes(item.id);
        allUl.appendChild(buildRow(item, isFav));
      });
    }
  }

  window.onload = function() {
    document.getElementById("searchInput").oninput = render;
    render();
  };
