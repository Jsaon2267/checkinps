<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>場地快速點車位系統</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #f1f5f9; margin: 0; padding: 20px 12px; color: #1e293b; }
    .container { max-width: 650px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    
    /* 頂部狀態列 */
    .header-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 14px; margin-bottom: 20px; }
    .header-title { font-size: 20px; font-weight: 700; color: #0f172a; margin: 0; }
    .user-badge { font-size: 13px; background: #e0e7ff; color: #3730a3; padding: 6px 12px; border-radius: 20px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
    .btn-logout { background: none; border: none; color: #ef4444; font-size: 12px; cursor: pointer; text-decoration: underline; padding: 0; }

    /* 搜尋欄位 */
    .search-box { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 12px; outline: none; transition: all 0.2s; margin-bottom: 20px; }
    .search-box:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    
    /* 區塊標題 */
    .section-title { font-size: 15px; font-weight: 700; color: #475569; margin: 16px 0 10px 0; display: flex; align-items: center; gap: 6px; }
    
    /* 我的最愛提示與容器 */
    .fav-card-box { background: #fffbeb; border: 1.5px solid #fef3c7; border-radius: 12px; padding: 12px 14px; margin-bottom: 24px; }
    .fav-card-box .section-title { margin-top: 0; color: #b45309; }

    /* 列表項目 */
    .list-group { list-style: none; padding: 0; margin: 0; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; transition: background 0.15s; border-radius: 8px; margin-bottom: 4px; }
    .list-item:hover { background-color: #f8fafc; }
    .fav-card-box .list-item { background: #ffffff; border: 1px solid #fde68a; }
    
    .item-info { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .star-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0 4px; color: #cbd5e1; transition: transform 0.15s, color 0.15s; line-height: 1; }
    .star-btn.active { color: #f59e0b; }
    .star-btn:hover { transform: scale(1.15); }
    .item-text { font-size: 15px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .btn-go { background: #2563eb; color: #ffffff; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; margin-left: 10px; transition: background 0.2s; }
    .btn-go:hover { background: #1d4ed8; }
    .empty-tip { text-align: center; color: #94a3b8; font-size: 13px; padding: 12px 0; }

    /* 工號驗證彈窗 */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 16px; }
    .modal-box { background: #ffffff; width: 100%; max-width: 380px; border-radius: 16px; padding: 30px 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2); text-align: center; }
    .modal-box h3 { margin: 0 0 10px 0; font-size: 20px; color: #0f172a; }
    .modal-box p { font-size: 13px; color: #64748b; margin-bottom: 20px; }
    .input-id { width: 100%; padding: 12px 14px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; outline: none; margin-bottom: 12px; text-align: center; text-transform: uppercase; font-weight: bold; }
    .input-id:focus { border-color: #2563eb; }
    .btn-submit { width: 100%; background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 13px; margin-top: 10px; display: none; }

    /* 底部管理工具 */
    .admin-footer { margin-top: 30px; border-top: 1px dashed #cbd5e1; padding-top: 15px; text-align: center; }
    .admin-btn { font-size: 12px; color: #64748b; background: none; border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 12px; cursor: pointer; }
  </style>
</head>
<body>

<!-- 1. 工號審核彈窗 -->
<div id="authModal" class="modal-overlay">
  <div class="modal-box">
    <h3>內部系統驗證</h3>
    <p>請輸入授權工號登入</p>
    <input type="text" id="staffIdInput" class="input-id" placeholder="請輸入工號 (例: ADMIN)" autocomplete="off">
    <button class="btn-submit" onclick="handleAuth()">驗證並進入</button>
    <div id="authError" class="error-msg">⚠️ 工號錯誤或未授權，請重試</div>
  </div>
</div>

<!-- 2. 主操作介面 -->
<div class="container" id="mainApp" style="display: none;">
  <div class="header-bar">
    <h1 class="header-title">場地車位點位系統</h1>
    <div class="user-badge">
      工號: <span id="currentStaffId"></span>
      <button class="btn-logout" onclick="handleLogout()">登出</button>
    </div>
  </div>

  <input type="text" id="searchInput" class="search-box" placeholder="🔍 快速搜尋場地名稱或代號...">

  <!-- 釘選我的最愛固定專區 -->
  <div class="fav-card-box">
    <div class="section-title">⭐ 我的常用場地 (釘選區)</div>
    <ul id="favoriteList" class="list-group"></ul>
  </div>

  <!-- 全部場地列表 -->
  <div class="section-title">📍 全部場地列表 (點擊★可加入釘選)</div>
  <ul id="allList" class="list-group"></ul>

  <!-- 底部日誌備份 -->
  <div class="admin-footer">
    <button class="admin-btn" onclick="exportLoginLogs()">📥 匯出此裝置登入稽核紀錄 (CSV)</button>
  </div>
</div>

<script>
  /* ========================================================
     1. 內碼設定區：工號白名單
  ======================================================== */
  const ALLOWED_STAFF_IDS = [
    "ADMIN",
    "PSS001",
    "PSS002",
    "A1001",
    "B2002",
    "T12345"
  ];

  /* 遠端 Google 試算表 Webhook 網址 (可填入 Apps Script 網址) */
  const REMOTE_AUDIT_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbyUNKMPb96UnDpnVZoZENclDs5XAoBOhh9LfgB8ag6kGGgFV9J1kdSw4zfSH4mJnQ/exec"; 

  /* ========================================================
     2. 精簡 10 個核心場地
  ======================================================== */
  const parkingData = [
    { name: "TA001 城市車旅海安站", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_TA001/login" },
    { name: "YA376 城市車旅全聯天母天玉", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA376/login" },
    { name: "YA372 天母傑仕堡", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA372/login" },
    { name: "YA426 城市車旅士林福德", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA426/login" },
    { name: "HA874A 城市車旅臺科大國際大樓", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HA874A/login" },
    { name: "YA449 城市車旅臺北大巨蛋", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA449/login" },
    { name: "YA357 城市車旅台北市府轉運站", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA357/login" },
    { name: "YA214 大義-全聯淡大", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_YA214/login" },
    { name: "HA166 城市車旅台中北屯站", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HA166/login" },
    { name: "HB426 城市車旅台南高鐵一站", url: "https://outsourced-signin.pss-group.xyz/check-in-system/PSS_HB426/login" }
  ];

  /* ========================================================
     3. 登入、審核與日誌
  ======================================================== */
  const AUTH_KEY = "PARKING_SYS_STAFF_ID";
  const LOGS_KEY = "PARKING_SYS_LOGIN_LOGS";
  const FAV_KEY = "PARKING_SYS_FAVORITES";

  let currentStaff = localStorage.getItem(AUTH_KEY) || "";
  let favorites = JSON.parse(localStorage.getItem(FAV_KEY) || '["TA001 城市車旅海安站"]');

  function recordLogin(staffId) {
    const timestamp = new Date().toLocaleString("zh-TW", { hour12: false });
    const logItem = { staffId: staffId, time: timestamp, agent: navigator.userAgent };
    
    // 1. 本地儲存
    let logs = JSON.parse(localStorage.getItem(LOGS_KEY) || "[]");
    logs.unshift(logItem);
    if (logs.length > 500) logs.pop();
    localStorage.setItem(LOGS_KEY, JSON.stringify(logs));

    // 2. 背景傳送至 Google 試算表
    if (REMOTE_AUDIT_WEBHOOK_URL && REMOTE_AUDIT_WEBHOOK_URL.trim() !== "") {
      fetch(REMOTE_AUDIT_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(logItem)
      }).then(() => {
        console.log("登入紀錄已送出至 Google 試算表");
      }).catch(err => {
        console.error("發送失敗:", err);
      });
    }
  }

  function handleAuth() {
    const inputVal = document.getElementById("staffIdInput").value.trim().toUpperCase();
    const errorEl = document.getElementById("authError");
    
    if (ALLOWED_STAFF_IDS.includes(inputVal)) {
      errorEl.style.display = "none";
      localStorage.setItem(AUTH_KEY, inputVal);
      currentStaff = inputVal;
      recordLogin(inputVal);
      initApp();
    } else {
      errorEl.style.display = "block";
    }
  }

  function handleLogout() {
    if (confirm("確定要登出切換工號嗎？")) {
      localStorage.removeItem(AUTH_KEY);
      location.reload();
    }
  }

  function exportLoginLogs() {
    const logs = JSON.parse(localStorage.getItem(LOGS_KEY) || "[]");
    if (logs.length === 0) {
      alert("目前尚無登入紀錄！");
      return;
    }
    let csvContent = "\uFEFF工號,登入時間,裝置資訊\n";
    logs.forEach(l => {
      csvContent += `"${l.staffId}","${l.time}","${l.agent.replace(/"/g, '""')}"\n`;
    });
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = `點車位登入紀錄_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  /* ========================================================
     4. 我的最愛與列表渲染
  ======================================================== */
  function toggleFavorite(name) {
    const index = favorites.indexOf(name);
    if (index > -1) {
      favorites.splice(index, 1);
    } else {
      favorites.push(name);
    }
    localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
    renderAll();
  }

  function createListItem(item, isFav) {
    const li = document.createElement("li");
    li.className = "list-item";
    li.innerHTML = `
      <div class="item-info">
        <button class="star-btn ${isFav ? 'active' : ''}" title="點擊切換最愛" onclick="toggleFavorite('${item.name.replace(/'/g, "\\'")}')">★</button>
        <span class="item-text" title="${item.name}">${item.name}</span>
      </div>
      <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-go">前往點車位</a>
    `;
    return li;
  }

  function renderAll() {
    const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
    const favList = document.getElementById("favoriteList");
    const allList = document.getElementById("allList");

    favList.innerHTML = "";
    allList.innerHTML = "";

    // 1. 渲染「我的最愛」
    const favItems = parkingData.filter(d => favorites.includes(d.name) && d.name.toLowerCase().includes(keyword));
    if (favorites.length === 0) {
      favList.innerHTML = `<li class="empty-tip">尚未釘選任何場地，可點擊下方場地的「★」加入常用</li>`;
    } else if (favItems.length === 0 && keyword !== "") {
      favList.innerHTML = `<li class="empty-tip">我的最愛中無相符場地</li>`;
    } else {
      favItems.forEach(item => favList.appendChild(createListItem(item, true)));
    }

    // 2. 渲染「全部列表」
    const filteredAll = parkingData.filter(d => d.name.toLowerCase().includes(keyword));
    if (filteredAll.length === 0) {
      allList.innerHTML = `<li class="empty-tip">查無符合的場地</li>`;
    } else {
      filteredAll.forEach(item => {
        const isFav = favorites.includes(item.name);
        allList.appendChild(createListItem(item, isFav));
      });
    }
  }

  function initApp() {
    document.getElementById("authModal").style.display = "none";
    document.getElementById("mainApp").style.display = "block";
    document.getElementById("currentStaffId").innerText = currentStaff;
    renderAll();
  }

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("staffIdInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") handleAuth();
    });

    document.getElementById("searchInput").addEventListener("input", renderAll);

    if (currentStaff && ALLOWED_STAFF_IDS.includes(currentStaff.toUpperCase())) {
      initApp();
    } else {
      document.getElementById("authModal").style.display = "flex";
      document.getElementById("mainApp").style.display = "none";
    }
  });
</script>

</body>
</html>
